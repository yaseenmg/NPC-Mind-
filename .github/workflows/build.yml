name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build and test (Gradle 8.1.1 wrapper, JDK 17)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test build

      - name: Static gates
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          python tools/check_api_surface.py
          python tools/source_audit.py
          python tools/verify_repair_regressions.py
          python tools/verify_mit_release.py

      - name: Upload library artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npc-mind-jars
          path: |
            build/libs/*.jar
          if-no-files-found: warn
