# NPC Mind — single source of truth for build coordinates and dependency versions.
# Every consumer-facing version lives here exactly once; build.gradle wires them through
# project.<property>. Bump mod_version AND NPCMindAPI.API_VERSION together, then update
# the pinned version in src/test/java/com/yaseen/npcmind/api/ApiCompatibilityTest.java.
#
# Build with JDK 17 only: the pinned Gradle wrapper 8.1.1 (required by ForgeGradle 6)
# cannot start on Java 21+ (Unsupported class file major version 65).

mod_version=1.3.1
mod_group=com.yaseen
mod_id=npcmind
mod_name=NPC Mind
mod_vendor=Yaseen

minecraft_version=1.20.1
forge_version=47.4.10

jetbrains_annotations_version=24.1.0
junit_version=5.10.2
