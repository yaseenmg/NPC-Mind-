# Gradle 8.1.1 is pinned for ForgeGradle [6.0,6.2) compatibility.
# Run the wrapper on JDK 17: Gradle 8.1.1 does not support running on Java 21+
# (error: Unsupported class file major version 65). The Java toolchain in
# build.gradle already compiles the sources with Java 17.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.1.1-bin.zip
networkTimeout=10000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
